apply plugin: 'com.android.application'

android {
    compileSdk project.COMPILE_SDK_VERSION.toInteger()
    namespace = "me.everything.overscrolldemo"
    defaultConfig {
        applicationId 'me.everything.overscrolldemo'
        minSdkVersion project.MIN_SDK_VERSION.toInteger()
        targetSdkVersion project.TARGET_SDK_VERSION.toInteger()
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation project(':lib_effect')
//    implementation 'io.github.everythingme:overscroll-decor-android:1.1.1'
}
