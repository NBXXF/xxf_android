// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    //  ext.kotlin_version = '1.5.20'
    ext.kotlin_version = '1.6.10'
    repositories {
        maven { url 'https://maven.aliyun.com/nexus/content/repositories/google' }
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public' }
        maven { url 'https://maven.aliyun.com/nexus/content/repositories/jcenter'}
        jcenter()
        maven { url "https://jitpack.io" }
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.21"
        classpath "io.objectbox:objectbox-gradle-plugin:4.0.0"
    }
}
plugins {
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.21' apply false
}
apply from: "config.gradle"
def getXXFUsername() {
    Properties properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
    def userName = properties.getProperty('xxf_android.username')
    return userName;
}
def getXXFPassword() {
    Properties properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
    def password = properties.getProperty('xxf_android.password')
    return password;
}

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/nexus/content/repositories/google' }
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public' }
        maven { url 'https://maven.aliyun.com/nexus/content/repositories/jcenter'}
        mavenLocal()
        mavenCentral()
        maven { url "https://jitpack.io" }
        jcenter()
        google()
        maven {url 'https://maven.aliyun.com/repository/jcenter'}

        //发布配置
        maven {
            url 'https://maven.aliyun.com/repository/public'
        }

        maven {
            credentials {
                username getXXFUsername()
                password getXXFPassword()
            }
            url 'https://packages.aliyun.com/654f22929afb401752743754/maven/2433389-release-rmv0jp'
        }
        maven {
            credentials {
                username getXXFUsername()
                password getXXFPassword()
            }
            url 'https://packages.aliyun.com/654f22929afb401752743754/maven/2433389-snapshot-kqt8id'
        }
    }
    configurations.all {
        ///禁止缓存,有snapshot版本
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'// maven禁止缓存
//        resolutionStrategy.force 'com.squareup.okhttp3:okhttp:4.7.2'
    }
    dependencies {
        components {
            all { details ->
                ///禁止缓存,有snapshot版本
                def group = details.id.group.toLowerCase()
                def version = details.id.version.toLowerCase()
                def isXXFSnapshotGroup = group == 'com.xxf' ||
                        group.startsWith('com.xxf.') ||
                        group == 'com.nb.xxf' ||
                        group.startsWith('com.nb.xxf.') ||
                        group == 'com.nbxxf.xxf_android' ||
                        group.startsWith('com.nbxxf.xxf_android.')
                if (isXXFSnapshotGroup && version.endsWith('-snapshot')) {
                    details.changing = true
                }
            }
        }
    }
}
task clean(type: Delete) {
    delete rootProject.buildDir
}


//全局版本号  发布命令 ./gradlew publish
//您的制品文件具体推送到哪个库，根据您项目目录的build.gradle文件中version字段中是否配置了-SNAPSHOT。
// compose 从6.0.0.0版本开始
// 传统版本还是5.2.2.7-SNAPSHOT 上面维护
ext {
    xxfVersion = "6.0.0.0-SNAPSHOT"
    xxfGroup = "com.NBXXF.xxf_android"
}
