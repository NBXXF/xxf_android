plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'

}
android {
    compileSdk project.TARGET_SDK_VERSION.toInteger()
    namespace = "com.xxf.view.viewpager.demo"
    defaultConfig {
        applicationId 'com.xxf.view.viewpager.demo'
        minSdkVersion project.MIN_SDK_VERSION.toInteger()
        targetSdkVersion project.TARGET_SDK_VERSION.toInteger()
        versionCode 1
        versionName "1.0"
    }
    lintOptions {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation libs.material
    implementation 'com.squareup.picasso:picasso:2.5.2'
    implementation project(':optional:lib_viewPager')
}
