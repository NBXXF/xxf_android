plugins {
    id 'com.android.library'
    id 'kotlin-android'
}
android {
    compileSdk project.TARGET_SDK_VERSION.toInteger()


    defaultConfig {
        minSdkVersion project.MIN_SDK_VERSION.toInteger()
        targetSdkVersion project.TARGET_SDK_VERSION.toInteger()
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError false
    }
    buildFeatures {
        buildConfig = false
    }
}

dependencies {
    api fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    compileOnly 'com.google.mlkit:vision-interfaces:16.3.0'
    compileOnly 'androidx.camera:camera-core:1.4.1'
    compileOnly 'com.google.mlkit:face-detection:16.1.7'
    compileOnly 'com.google.mlkit:barcode-scanning:17.3.0'
    compileOnly 'io.github.devilsen:czxing:1.2.0'
    implementation project(path: ':lib_ktx')
    implementation project(path: ':lib_utils')
//    api 'androidx.camera:camera-view:1.4.1'
}
ext {
    publishVersion = rootProject.xxfVersion
    publishGroup = rootProject.xxfGroup
    moduleName = project.name
    descContent = project.name
}

apply from: '../../publish_maven.gradle'
