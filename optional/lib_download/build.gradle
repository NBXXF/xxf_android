plugins {
    id 'com.android.library'
    id 'kotlin-android'
}
def des = rootProject.ext.dependencies
android {
    compileSdk project.TARGET_SDK_VERSION.toInteger()
    namespace = "com.xxf.download"

    defaultConfig {
        minSdkVersion project.MIN_SDK_VERSION.toInteger()
        targetSdkVersion project.TARGET_SDK_VERSION.toInteger()
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    buildFeatures {
        buildConfig = false
    }
}

dependencies {
    api fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation libs.okdownload
    implementation libs.okdownload.sqlite
    implementation libs.okdownload.okhttp
    api project(':lib_log')
    api project(':lib_adapter')
    api libs.kpower.database
}
ext {
    publishVersion = rootProject.xxfVersion
    publishGroup = rootProject.xxfGroup
    moduleName = project.name
    descContent = project.name
}

apply from: '../../publish_maven.gradle'
